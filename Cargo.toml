[package]
name = "kitty-pick"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kitty_pick"

[[bin]]
name = "kitty-pick"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ignore = "0.4.35"
skim = { version = "5.9.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
